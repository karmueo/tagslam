tagslam_parameters:
  optimizer_mode: fast
  minimum_viewing_angle: 15.0
  minimum_tag_area: 2000
  max_num_incremental_opt: 50000
  pixel_noise: 1.0
  max_subgraph_error: 50.0
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  use_approximate_sync: false
body_defaults:
  position_noise: 0.05
  rotation_noise: 0.01
default_body: environment
bodies:
- environment:
    is_static: true
    type: simple
    default_tag_size: 0.144
    pose:
      position:
        x: 0.0
        y: 0.0
        z: 0.0
      rotation:
        x: 0.0
        y: 0.0
        z: 0.0
      position_noise:
        x: 0.0001
        y: 0.0001
        z: 0.0001
      rotation_noise:
        x: 1.0e-05
        y: 1.0e-05
        z: 1.0e-05
    tags:
    - id: 0
      pose:
        position:
          x: 0.0
          y: 0.0
          z: 0.0
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
        position_noise:
          x: 0.0001
          y: 0.0001
          z: 0.0001
        rotation_noise:
          x: 1.0e-05
          y: 1.0e-05
          z: 1.0e-05
- rig:
    is_static: false
    type: simple
    odom_frame_id: rig
